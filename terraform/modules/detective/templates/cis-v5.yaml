##############################################################################
# CIS AWS Foundations Benchmark v5.0 (trimmed to the Config-checkable subset).
#
# Security Hub already runs the full CIS v5.0 standard. This pack exists for the
# checks an auditor wants to query historically -- Config keeps the timeline,
# Security Hub keeps only the current state -- and for accounts where Security
# Hub is off but Config is on.
#
# Rule names carry the benchmark section number so a Config finding maps
# straight onto a benchmark row.
#
# This is NOT the full benchmark. See CONTROLS.md DET-006.
##############################################################################
Resources:
  # --- Section 1: Identity and Access Management ---------------------------
  Cis1_4RootAccessKeys:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-4-iam-root-access-key-check
      Description: CIS 1.4 - no root account access key exists.
      Source:
        Owner: AWS
        SourceIdentifier: IAM_ROOT_ACCESS_KEY_CHECK

  Cis1_5RootMfa:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-5-root-account-mfa-enabled
      Description: CIS 1.5 - MFA is enabled on the root user.
      Source:
        Owner: AWS
        SourceIdentifier: ROOT_ACCOUNT_MFA_ENABLED

  Cis1_6HardwareMfaRoot:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-6-root-account-hardware-mfa-enabled
      Description: CIS 1.6 - the root MFA device is hardware, not a phone that can be SIM-swapped.
      Source:
        Owner: AWS
        SourceIdentifier: ROOT_ACCOUNT_HARDWARE_MFA_ENABLED

  Cis1_10ConsoleMfa:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-10-mfa-enabled-for-iam-console-access
      Description: CIS 1.10 - MFA on every IAM user with a console password.
      Source:
        Owner: AWS
        SourceIdentifier: MFA_ENABLED_FOR_IAM_CONSOLE_ACCESS

  Cis1_12UnusedCredentials:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-12-iam-user-unused-credentials-check
      Description: CIS 1.12 - credentials unused for 45 days are disabled.
      Source:
        Owner: AWS
        SourceIdentifier: IAM_USER_UNUSED_CREDENTIALS_CHECK
      InputParameters:
        maxCredentialUsageAge: "45"

  Cis1_14AccessKeyRotation:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-14-access-keys-rotated
      Description: CIS 1.14 - access keys rotated within 90 days.
      Source:
        Owner: AWS
        SourceIdentifier: ACCESS_KEYS_ROTATED
      InputParameters:
        maxAccessKeyAge: "90"

  Cis1_15UserPoliciesViaGroups:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-15-iam-user-no-policies-check
      Description: CIS 1.15 - IAM users receive permissions through groups only.
      Source:
        Owner: AWS
        SourceIdentifier: IAM_USER_NO_POLICIES_CHECK

  Cis1_16NoAdminPolicies:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-16-iam-policy-no-statements-with-admin-access
      Description: CIS 1.16 - no customer-managed policy allows full administrative privileges.
      Source:
        Owner: AWS
        SourceIdentifier: IAM_POLICY_NO_STATEMENTS_WITH_ADMIN_ACCESS

  Cis1_20AccessAnalyzer:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-1-20-iam-external-access-analyzer-enabled
      Description: CIS 1.20 - IAM Access Analyzer is enabled in every active region.
      Source:
        Owner: AWS
        SourceIdentifier: IAM_EXTERNAL_ACCESS_ANALYZER_ENABLED

  # --- Section 2: Storage ---------------------------------------------------
  Cis2_1_1S3Encryption:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-2-1-1-s3-bucket-server-side-encryption-enabled
      Description: CIS 2.1.1 - default encryption on every bucket.
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_SERVER_SIDE_ENCRYPTION_ENABLED

  Cis2_1_2S3SslOnly:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-2-1-2-s3-bucket-ssl-requests-only
      Description: CIS 2.1.2 - bucket policies require SSL.
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_SSL_REQUESTS_ONLY

  Cis2_1_4S3PublicAccessBlock:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-2-1-4-s3-account-level-public-access-blocks
      Description: CIS 2.1.4 - account-level Block Public Access is on for all four settings.
      Source:
        Owner: AWS
        SourceIdentifier: S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC

  Cis2_2_1EbsEncryption:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-2-2-1-ec2-ebs-encryption-by-default
      Description: CIS 2.2.1 - EBS encryption by default is enabled.
      Source:
        Owner: AWS
        SourceIdentifier: EC2_EBS_ENCRYPTION_BY_DEFAULT

  Cis2_3_1RdsEncryption:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-2-3-1-rds-storage-encrypted
      Description: CIS 2.3.1 - RDS instances are encrypted at rest.
      Source:
        Owner: AWS
        SourceIdentifier: RDS_STORAGE_ENCRYPTED

  # --- Section 3: Logging ---------------------------------------------------
  Cis3_1CloudTrailMultiRegion:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-1-multi-region-cloud-trail-enabled
      Description: CIS 3.1 - CloudTrail is enabled in all regions.
      Source:
        Owner: AWS
        SourceIdentifier: MULTI_REGION_CLOUD_TRAIL_ENABLED

  Cis3_2LogFileValidation:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-2-cloud-trail-log-file-validation-enabled
      Description: CIS 3.2 - log file validation is enabled on all trails.
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_LOG_FILE_VALIDATION_ENABLED

  Cis3_4TrailKmsEncryption:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-4-cloud-trail-encryption-enabled
      Description: CIS 3.4 - trail logs are encrypted at rest with a KMS CMK.
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_ENCRYPTION_ENABLED

  Cis3_5ConfigEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-5-cloudtrail-security-trail-enabled
      Description: CIS 3.5 - a trail meeting every security requirement exists.
      Source:
        Owner: AWS
        SourceIdentifier: CLOUDTRAIL_SECURITY_TRAIL_ENABLED

  Cis3_6S3BucketAccessLogging:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-6-s3-bucket-logging-enabled
      Description: CIS 3.6 - S3 access logging on the CloudTrail bucket.
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_LOGGING_ENABLED

  Cis3_7KmsKeyRotation:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-7-cmk-backing-key-rotation-enabled
      Description: CIS 3.7 - rotation is enabled for all customer-managed keys.
      Source:
        Owner: AWS
        SourceIdentifier: CMK_BACKING_KEY_ROTATION_ENABLED

  Cis3_9VpcFlowLogs:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-3-9-vpc-flow-logs-enabled
      Description: CIS 3.9 - VPC flow logging is enabled in all VPCs.
      Source:
        Owner: AWS
        SourceIdentifier: VPC_FLOW_LOGS_ENABLED

  # --- Section 5: Networking ------------------------------------------------
  Cis5_1NoIngressToAdminPorts:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-5-1-restricted-incoming-traffic
      Description: CIS 5.1/5.2 - no security group allows unrestricted ingress to remote admin ports.
      Source:
        Owner: AWS
        SourceIdentifier: RESTRICTED_INCOMING_TRAFFIC

  Cis5_4DefaultSecurityGroupClosed:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-5-4-vpc-default-security-group-closed
      Description: CIS 5.4 - the default security group of every VPC restricts all traffic.
      Source:
        Owner: AWS
        SourceIdentifier: VPC_DEFAULT_SECURITY_GROUP_CLOSED

  Cis5_6Imdsv2:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cis-5-6-ec2-imdsv2-check
      Description: CIS 5.6 - EC2 instances require IMDSv2.
      Source:
        Owner: AWS
        SourceIdentifier: EC2_IMDSV2_CHECK
